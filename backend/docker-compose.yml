services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: itadis_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-itadis_db}
      POSTGRES_USER: ${DB_USER:-itadis_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-itadis_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - itadis_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-itadis_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Web Application
  web:
    build: .
    container_name: itadis_web
    restart: always
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate &&
             gunicorn mysite.wsgi:application --bind 0.0.0.0:8000 --workers 4 --timeout 120 --access-logfile - --error-logfile -"
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - ./logs:/app/logs
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - itadis_network

volumes:
  postgres_data:
    driver: local
  static_volume:
    driver: local
  media_volume:
    driver: local

networks:
  itadis_network:
    driver: bridge
