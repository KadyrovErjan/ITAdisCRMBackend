services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: itadis_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME must be set in .env}
      POSTGRES_USER: ${DB_USER:?DB_USER must be set in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - itadis_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:?DB_USER must be set in .env} -d ${DB_NAME:?DB_NAME must be set in .env}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Web Application
  web:
    build: .
    container_name: itadis_web
    restart: always
    command: >
      gunicorn mysite.wsgi:application --bind 0.0.0.0:8000 --workers 4
      --timeout 120 --access-logfile - --error-logfile -
    volumes:
      # Host mounts allow the host Nginx configuration to serve uploaded and
      # collected files without exposing the Django container directly.
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
      - ./logs:/app/logs
    ports:
      # Public traffic must go through Nginx; only local Nginx can reach this.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - itadis_network
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --header 'Host: api.itadiscrm.com.kg' --header 'X-Forwarded-Proto: https' http://127.0.0.1:8000/healthz/)\" = '200'"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  postgres_data:
    driver: local

networks:
  itadis_network:
    driver: bridge
