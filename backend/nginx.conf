server {
    listen 80;
    server_name api.itadiscrm.com.kg itadiscrm.com.kg www.itadiscrm.com.kg 13.62.102.119;
    
    client_max_body_size 10M;
    
    # Логи
    access_log /var/log/nginx/itadiscrm-access.log;
    error_log /var/log/nginx/itadiscrm-error.log;
    
    # Статические файлы
    location /static/ {
        alias /home/ubuntu/apps/ITAdisCRMBackend/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
    
    # Медиа файлы
    location /media/ {
        alias /home/ubuntu/apps/ITAdisCRMBackend/backend/media/;
        expires 7d;
        add_header Cache-Control "public";
    }
    
    # Проксирование к Django (Docker)
    location / {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        
        # Таймауты
        proxy_connect_timeout 120s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}

# После получения SSL сертификата Certbot автоматически добавит HTTPS конфигурацию
