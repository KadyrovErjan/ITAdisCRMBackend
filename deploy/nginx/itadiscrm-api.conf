# Install as /etc/nginx/sites-available/itadiscrm-api.conf before running
# certbot. Certbot adds the HTTPS server block and certificate paths in place.

server {
    listen 80;
    listen [::]:80;
    server_name api.itadiscrm.com.kg;

    server_tokens off;
    client_max_body_size 100M;

    access_log /var/log/nginx/itadiscrm-api.access.log;
    error_log /var/log/nginx/itadiscrm-api.error.log warn;

    location /static/ {
        alias /opt/itadiscrm/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /media/ {
        alias /opt/itadiscrm/backend/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
